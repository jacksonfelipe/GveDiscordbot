<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvE Tactical Radar</title>
    <style>
        body { margin: 0; padding: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; overflow: hidden; color: #fff; }
        
        #radar-container {
            position: relative;
            width: 95vh;
            height: 95vh;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            overflow: hidden;
        }

        #grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .city-label {
            position: absolute;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .pvp-point { 
            position: absolute; 
            width: 10px; height: 10px; 
            border-radius: 50%; 
            transform: translate(-50%, -50%);
            z-index: 50;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .char-name {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.85);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(5); opacity: 0; }
        }

        #ui-overlay { 
            position: absolute; top: 30px; left: 30px; 
            background: rgba(10, 10, 10, 0.9); 
            padding: 20px; border-radius: 10px; 
            border-left: 4px solid #ffd700; 
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; font-weight: 900; letter-spacing: 1px; }
        .stat { font-size: 13px; margin-bottom: 5px; color: #aaa; }
        .legend { margin-top: 15px; display: flex; gap: 20px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>BATTLEFIELD RADAR</h1>
        <div class="stat">Sincronização Ativa • <span id="pvp-count" style="color:#fff; font-weight:bold;">0</span> Players</div>
        <div class="legend">
            <div class="legend-item"><span style="width:10px;height:100%;background:#ff4444;border-radius:2px;display:inline-block"></span> Faction A (Varka)</div>
            <div class="legend-item"><span style="width:10px;height:100%;background:#4444ff;border-radius:2px;display:inline-block"></span> Faction B (Ketra)</div>
        </div>
    </div>

    <div id="radar-container">
        <div id="grid"></div>
        <div id="cities-layer"></div>
        <div id="players-layer"></div>
    </div>

    <script>
        // Coordenadas Reais das Cidades (Calibração Fixa Baseada no Core)
        const CITIES = [
            { name: "Talking Island", x: -84081, y: 243227 },
            { name: "Gludio", x: -12672, y: 122776 },
            { name: "Dion", x: 15666, y: 142983 },
            { name: "Giran", x: 83448, y: 148607 },
            { name: "Oren", x: 82956, y: 53162 },
            { name: "Aden", x: 146604, y: 25752 },
            { name: "Hunters Village", x: 116819, y: 76992 },
            { name: "Heine", x: 111394, y: 219154 },
            { name: "Goddard", x: 147450, y: -56315 },
            { name: "Rune", x: 43503, y: -47732 },
            { name: "Schuttgart", x: 87386, y: -143246 }
        ];

        function convertCoords(x, y) {
            // Range Total do Mundo L2
            const xMin = -131072;
            const xMax = 229376;
            const yMin = -262144;
            const yMax = 262144;

            let left = ((x - xMin) / (xMax - xMin)) * 100;
            let top = 100 - (((y - yMin) / (yMax - yMin)) * 100);
            
            return { left, top };
        }

        // Renderiza Cidades (Camada Estática)
        const citiesLayer = document.getElementById('cities-layer');
        CITIES.forEach(city => {
            const pos = convertCoords(city.x, city.y);
            const label = document.createElement('div');
            label.className = 'city-label';
            label.style.left = pos.left + '%';
            label.style.top = pos.top + '%';
            label.innerText = city.name;
            citiesLayer.appendChild(label);
        });

        // Função para encontrar a localidade mais próxima
        function getNearestLocation(x, y) {
            let nearest = "Wasteland";
            let minDist = Infinity;
            
            CITIES.forEach(city => {
                const dist = Math.sqrt(Math.pow(x - city.x, 2) + Math.pow(y - city.y, 2));
                if (dist < minDist) {
                    minDist = dist;
                    nearest = city.name;
                }
            });
            
            return minDist < 25000 ? nearest : nearest + " Outskirts";
        }

        // Estado para rastrear posições anteriores e detectar teleporte
        let lastPositions = {};

        async function updateRadar() {
            try {
                const response = await fetch('/api/heatmap/pvp');
                const data = await response.json();
                
                const layer = document.getElementById('players-layer');
                document.getElementById('pvp-count').innerText = data.length;
                
                // Em vez de limpar tudo, vamos apenas atualizar ou remover
                const currentIds = new Set();

                data.forEach(char => {
                    const charId = char.char_name;
                    currentIds.add(charId);
                    const pos = convertCoords(char.x, char.y);
                    const locName = getNearestLocation(char.x, char.y);
                    
                    let point = document.getElementById(`player-${charId}`);
                    let isTeleport = false;

                    // Detecta Teleporte (Mudança brusca de posição)
                    if (lastPositions[charId]) {
                        const dist = Math.sqrt(Math.pow(char.x - lastPositions[charId].x, 2) + Math.pow(char.y - lastPositions[charId].y, 2));
                        if (dist > 5000) isTeleport = true;
                    }

                    if (!point) {
                        point = document.createElement('div');
                        point.id = `player-${charId}`;
                        point.className = 'pvp-point';
                        layer.appendChild(point);
                    }

                    point.style.left = pos.left + '%';
                    point.style.top = pos.top + '%';

                    let color = '#ffd700';
                    if (char.faction) {
                        const f = char.faction.toString().toLowerCase();
                        if (f.includes('varka') || f === '1') color = '#ff4444';
                        if (f.includes('ketra') || f === '2') color = '#4444ff';
                    }

                    point.style.background = isTeleport ? '#fff' : color;
                    point.style.boxShadow = isTeleport ? `0 0 40px #fff` : `0 0 20px ${color}`;
                    
                    // Atualiza conteúdo
                    point.innerHTML = `
                        <div class="char-name" style="color:${color}; text-align:center;">
                            ${char.char_name}<br>
                            <span style="font-size:7px;opacity:0.7;font-weight:normal;">${locName}</span>
                        </div>
                        <div class="pulse" style="border:1.5px solid ${isTeleport ? '#fff' : color}"></div>
                    `;

                    lastPositions[charId] = { x: char.x, y: char.y };
                });

                // Remove quem deslogou
                document.querySelectorAll('.pvp-point').forEach(p => {
                    const id = p.id.replace('player-', '');
                    if (!currentIds.has(id)) p.remove();
                });

            } catch (err) { console.error("Erro no Radar:", err); }
        }

        setInterval(updateRadar, 3000);
        updateRadar();
    </script>
</body>
</html>
