<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvE Tactical Radar</title>
    <style>
        body { margin: 0; padding: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; overflow: hidden; color: #fff; }
        
        #radar-container {
            position: relative;
            width: 95vh;
            height: 95vh;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            overflow: hidden;
        }

        #grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .city-label {
            position: absolute;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .pvp-point { 
            position: absolute; 
            width: 10px; height: 10px; 
            border-radius: 50%; 
            transform: translate(-50%, -50%);
            z-index: 50;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .char-name {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(5); opacity: 0; }
        }

        #ui-overlay { 
            position: absolute; top: 30px; left: 30px; 
            background: rgba(10, 10, 10, 0.9); 
            padding: 20px; border-radius: 10px; 
            border-left: 4px solid #ffd700; 
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; font-weight: 900; letter-spacing: 1px; }
        .stat { font-size: 13px; margin-bottom: 5px; color: #aaa; }
        .legend { margin-top: 15px; display: flex; gap: 20px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>BATTLEFIELD RADAR</h1>
        <div class="stat">Sincronização Ativa • <span id="pvp-count" style="color:#fff; font-weight:bold;">0</span> Players</div>
        <div class="legend">
            <div class="legend-item"><span style="width:10px;height:10px;background:#4444ff;border-radius:50%;display:inline-block"></span> Angel</div>
            <div class="legend-item"><span style="width:10px;height:10px;background:#ff4444;border-radius:50%;display:inline-block"></span> Evil</div>
            <div class="legend-item"><span style="width:10px;height:10px;background:#ffffff;border-radius:50%;display:inline-block"></span> Neutro</div>
        </div>
    </div>

    <div id="radar-container">
        <div id="grid"></div>
        <div id="cities-layer"></div>
        <div id="players-layer"></div>
    </div>

    <script>
        let ZONES = [];
        let lastPositions = {};

        // Range Total do Mundo L2
        const xMin = -131072;
        const xMax = 229376;
        const yMin = -262144;
        const yMax = 262144;

        function convertCoords(x, y) {
            let left = ((x - xMin) / (xMax - xMin)) * 100;
            let top = 100 - (((y - yMin) / (yMax - yMin)) * 100);
            return { left, top };
        }

        // Carrega Zonas do Banco (Apenas nomes únicos e importantes)
        async function loadZones() {
            try {
                const response = await fetch('/api/heatmap/zones');
                const rawZones = await response.json();
                
                // Filtra para não repetir nomes e priorizar Fortes/Cidades
                const uniqueNames = new Set();
                ZONES = rawZones.filter(z => {
                    if (uniqueNames.has(z.name)) return false;
                    uniqueNames.add(z.name);
                    return true;
                });
                
                const citiesLayer = document.getElementById('cities-layer');
                citiesLayer.innerHTML = ''; 
                
                ZONES.forEach(zone => {
                    // Só mostra no fundo se for um Forte ou Cidade Principal
                    const isMajor = zone.type === 'fort' || !zone.name.includes('Outskirts');
                    if (isMajor && zone.name.length < 20) {
                        const pos = convertCoords(zone.x, zone.y);
                        const label = document.createElement('div');
                        label.className = 'city-label';
                        label.style.left = pos.left + '%';
                        label.style.top = pos.top + '%';
                        label.innerText = zone.name;
                        if (zone.type === 'fort') {
                            label.style.color = 'rgba(255, 215, 0, 0.6)';
                            label.style.fontWeight = 'bold';
                        }
                        citiesLayer.appendChild(label);
                    }
                });
            } catch (err) { console.error("Erro ao carregar zonas:", err); }
        }

        function getNearestLocation(x, y) {
            let nearest = "Unknown Area";
            let minDist = Infinity;
            
            ZONES.forEach(zone => {
                const dist = Math.sqrt(Math.pow(x - zone.x, 2) + Math.pow(y - zone.y, 2));
                if (dist < minDist) {
                    minDist = dist;
                    nearest = zone.name;
                }
            });
            
            return minDist < 15000 ? nearest : nearest + " Outskirts";
        }

        async function updateRadar() {
            try {
                const response = await fetch('/api/heatmap/pvp');
                const data = await response.json();
                
                const layer = document.getElementById('players-layer');
                document.getElementById('pvp-count').innerText = data.length;
                
                // Em vez de limpar tudo, vamos apenas atualizar ou remover
                const currentIds = new Set();

                data.forEach(char => {
                    const charId = char.char_name;
                    currentIds.add(charId);
                    const pos = convertCoords(char.x, char.y);
                    const locName = getNearestLocation(char.x, char.y);
                    
                    let point = document.getElementById(`player-${charId}`);
                    let isTeleport = false;

                    // Detecta Teleporte (Mudança brusca de posição)
                    if (lastPositions[charId]) {
                        const dist = Math.sqrt(Math.pow(char.x - lastPositions[charId].x, 2) + Math.pow(char.y - lastPositions[charId].y, 2));
                        if (dist > 5000) isTeleport = true;
                    }

                    if (!point) {
                        point = document.createElement('div');
                        point.id = `player-${charId}`;
                        point.className = 'pvp-point';
                        layer.appendChild(point);
                    }

                    point.style.left = pos.left + '%';
                    point.style.top = pos.top + '%';

                    let color = '#ffffff'; // Sem facção (Branco Vivo)
                    if (char.faction) {
                        const f = char.faction.toString().toLowerCase();
                        if (f.includes('angel') || f === '1') color = '#4444ff'; // Angel (Azul)
                        if (f.includes('evil') || f === '2') color = '#ff4444'; // Evil (Vermelho)
                    }

                    point.style.background = isTeleport ? '#fff' : color;
                    point.style.boxShadow = isTeleport ? `0 0 40px #fff` : `0 0 15px ${color}`;
                    
                    // Informação ao passar o mouse
                    point.title = `${char.char_name} | Local: ${locName}`;
                    
                    // Conteúdo interno (apenas o pulso)
                    point.innerHTML = `
                        <div class="pulse" style="border:1.5px solid ${isTeleport ? '#fff' : color}"></div>
                    `;

                    lastPositions[charId] = { x: char.x, y: char.y };
                });

                // Remove quem deslogou
                document.querySelectorAll('.pvp-point').forEach(p => {
                    const id = p.id.replace('player-', '');
                    if (!currentIds.has(id)) p.remove();
                });

                // Auto-Pan (Câmera Móvel): Centraliza nos jogadores
                if (data.length > 0) {
                    let avgLeft = 0, avgTop = 0;
                    data.forEach(char => {
                        const pos = convertCoords(char.x, char.y);
                        avgLeft += pos.left;
                        avgTop += pos.top;
                    });
                    
                    avgLeft /= data.length;
                    avgTop /= data.length;
                    
                    const shiftX = 50 - avgLeft;
                    const shiftY = 50 - avgTop;
                    
                    const layers = [citiesLayer, layer, document.getElementById('grid')];
                    layers.forEach(l => {
                        l.style.transition = 'transform 2s cubic-bezier(0.1, 0, 0.3, 1)';
                        l.style.transform = `translate(${shiftX}%, ${shiftY}%)`;
                    });
                }

            } catch (err) { console.error("Erro no Radar:", err); }
        }

        setInterval(updateRadar, 3000);
        loadZones().then(updateRadar);
    </script>
</body>
</html>
