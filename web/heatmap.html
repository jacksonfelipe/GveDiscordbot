<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvE Real-Time Heatmap</title>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: sans-serif; }
        #map-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111 url('https://images.squarespace-cdn.com/content/v1/59691880414fb58f7004f2f7/1501332822108-O94N2W2V2T2X2X2X2X2X/L2_Map.jpg') no-repeat center; 
            background-size: contain; 
            image-rendering: pixelated;
        }
        .pvp-point { 
            position: absolute; 
            width: 15px; height: 15px; 
            background: rgba(255, 0, 0, 0.7); 
            border-radius: 50%; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(4); opacity: 0; }
        }
        #ui-overlay { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.8); 
            padding: 15px; border-radius: 10px; 
            border: 1px solid #ffd700; 
            z-index: 10;
        }
        h1 { margin: 0; font-size: 18px; color: #ffd700; }
        .stat { font-size: 14px; margin-top: 5px; color: #ccc; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>🔥 Campo de Batalha</h1>
        <div class="stat">PVPs recentes: <span id="pvp-count">0</span></div>
        <div class="stat" style="color: #4CAF50;">Atualizando em tempo real...</div>
    </div>

    <div id="map-container">
        <!-- Pontos de PVP sero inseridos aqui via JS -->
    </div>

    <script>
        // Funo para converter coordenadas do L2 para % da tela
        function convertCoords(x, y) {
            // Ajuste fino para o mapa mundial padro
            const left = ((x + 131072) / 524288) * 100;
            const top = ((y + 262144) / 524288) * 100;
            return { left, top };
        }

        async function updateHeatmap() {
            try {
                const response = await fetch('/api/heatmap/pvp');
                const data = await response.json();
                
                const container = document.getElementById('map-container');
                document.getElementById('pvp-count').innerText = data.length;
                
                // Limpa pontos antigos
                document.querySelectorAll('.pvp-point').forEach(el => el.remove());

                data.forEach(pvp => {
                    const pos = convertCoords(pvp.x, pvp.y);
                    const point = document.createElement('div');
                    point.className = 'pvp-point';
                    point.style.left = pos.left + '%';
                    point.style.top = pos.top + '%';
                    container.appendChild(point);
                });
            } catch (err) {
                console.error("Erro ao carregar heatmap:", err);
            }
        }

        setInterval(updateHeatmap, 5000);
        updateHeatmap();
    </script>
</body>
</html>
