<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvE Real-Time Heatmap</title>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: sans-serif; }
        #map-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111 url('map.jpg'), url('https://legacy-lineage2.com/images/knowledge/Worldmap_Chroncicle2-Aden_E_big.jpg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; 
            image-rendering: auto;
        }
        .pvp-point { 
            position: absolute; 
            width: 15px; height: 15px; 
            background: rgba(255, 0, 0, 0.7); 
            border-radius: 50%; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(4); opacity: 0; }
        }
        #ui-overlay { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.8); 
            padding: 15px; border-radius: 10px; 
            border: 1px solid #ffd700; 
            z-index: 10;
        }
        h1 { margin: 0; font-size: 18px; color: #ffd700; }
        .stat { font-size: 14px; margin-top: 5px; color: #ccc; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>⚔️ GvE Live Activity</h1>
        <div class="stat">Jogadores Online: <span id="pvp-count">0</span></div>
        <div class="stat"><span style="color: #ff4444;">●</span> Faction A | <span style="color: #4444ff;">●</span> Faction B</div>
        <div class="stat" style="color: #4CAF50;">Atualizando em tempo real...</div>
    </div>

    <div id="map-container">
        <!-- Atividade ser inserida aqui via JS -->
    </div>

    <script>
        function convertCoords(x, y) {
            // Converso padro L2 (pode precisar de ajuste dependendo do mapa)
            const left = ((x + 131072) / 524288) * 100;
            const top = ((y + 262144) / 524288) * 100;
            return { left, top };
        }

        async function updateHeatmap() {
            try {
                const response = await fetch('/api/heatmap/pvp');
                const data = await response.json();
                
                const container = document.getElementById('map-container');
                document.getElementById('pvp-count').innerText = data.length;
                
                document.querySelectorAll('.pvp-point').forEach(el => el.remove());

                data.forEach(char => {
                    const pos = convertCoords(char.x, char.y);
                    const point = document.createElement('div');
                    point.className = 'pvp-point';
                    
                    // Cor baseada na facção
                    let color = 'rgba(255, 215, 0, 0.7)'; // Neutro (Dourado)
                    if (char.faction) {
                        const f = char.faction.toLowerCase();
                        if (f.includes('varka') || f === '1') color = 'rgba(255, 50, 50, 0.8)';
                        if (f.includes('ketra') || f === '2') color = 'rgba(50, 50, 255, 0.8)';
                    }

                    point.style.left = pos.left + '%';
                    point.style.top = pos.top + '%';
                    point.style.background = color;
                    point.style.boxShadow = `0 0 15px ${color}`;
                    
                    // Tooltip com nome do char
                    point.title = char.char_name;
                    
                    container.appendChild(point);
                });
            } catch (err) {
                console.error("Erro ao carregar heatmap:", err);
            }
        }

        setInterval(updateHeatmap, 5000);
        updateHeatmap();
    </script>
</body>
</html>
